name: in_donlotin
description: "Universal Media Downloader Mobile App for Android (Instagram, YouTube, Twitter/X, Pinterest, Threads, TikTok)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking & Streaming
  dio: ^5.4.3+1
  http: ^1.2.1

  # State Management
  provider: ^6.1.2

  # Storage & Preferences
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  open_filex: ^4.5.0

  # Media Viewing & Playback
  video_player: ^2.8.6
  chewie: ^1.8.1
  cached_network_image: ^3.3.1
  photo_view: ^0.14.0

  # Sharing & Utilities
  share_plus: ^9.0.0
  intl: ^0.19.0
  flutter_spinkit: ^5.2.1

  # Icons & Styling
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
